<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>زوبان</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:15px}h1{color:#38bdf8;text-align:center}.card{background:#1e293b;border-radius:16px;padding:18px;margin:15px auto;max-width:600px;border:1px solid #334155}input{width:100%;padding:12px;border-radius:8px;border:2px solid #38bdf8;background:#0f172a;color:#fff;font-size:18px;text-align:center;direction:ltr}button{background:#38bdf8;color:#000;border:none;padding:10px 24px;border-radius:8px;font-weight:bold;margin-top:10px;display:block;margin:10px auto}.r{margin-top:12px;line-height:1.8}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c{background:#0f172a;border-radius:10px;padding:8px;text-align:center;border:1px solid #334155}.c b{color:#38bdf8;display:block}.s{color:#94a3b8;font-size:11px;direction:ltr}</style></head><body><h1>زوبان شغال</h1><div class="card"><input id="bin" placeholder="00001 00010"><button onclick="go()">حول</button><div class="r" id="res"></div></div><div class="card"><div class="g" id="grid"></div></div><script>const m=[['ا','00001',1],['ب','00010',2],['ت','00011',3],['ث','00100',4],['ج','00101',5],['ح','00110',6],['خ','00111',7],['د','01000',8],['ذ','01001',9],['ر','01010',10],['ز','01011',11],['س','01100',12],['ش','01101',13],['ص','01110',14],['ض','01111',15],['ط','10000',16],['ظ','10001',17],['ع','10010',18],['غ','10011',19],['ف','10100',20],['ق','10101',21],['ك','10110',22],['ل','10111',23],['م','11000',24],['ن','11001',25],['ه','11010',26],['و','11011',27],['ي','11100',28],['ء','11101',29]];document.getElementById('grid').innerHTML=m.map(x=>`<div class="c"><b>${x[0]}</b><div class="s">${x[1]}<br>${x[2]}</div></div>`).join('');function go(){let p=document.getElementById('bin').value.trim().split(/[\s-]+/).filter(x=>x);if(p.length==1&&p[0].length>5)p=p[0].match(/.{1,5}/g)||[];let o='';p.forEach(b=>{b=b.replace(/[^01]/g,'');if(b.length!=5){o+=`[${b}] لازم 5 ارقام<br>`;return}let d=parseInt(b,2);let f=m.find(z=>z[1]==b);if(f)o+=`${f[0]} = ${d}<br>`;else o+=`${b} = ${d}<br>`});document.getElementById('res').innerHTML=o||'اكتب باينري'};</script></body></html>
